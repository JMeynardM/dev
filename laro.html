<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I GOT YOU!</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#10121e;color:#f5f5ff;font-family:"Courier New",monospace;padding:20px}.game{width:100%;max-width:540px;padding:22px;background:#1b1e30;border:3px solid #7379a9;box-shadow:7px 7px 0 #080912}header{text-align:center;margin-bottom:18px}h1{margin:0;font-size:clamp(26px,7vw,38px);color:#ffe66d;letter-spacing:4px;text-shadow:3px 3px #e84a8a}.subtitle{color:#a7acd2;font-size:11px;margin-top:8px;letter-spacing:2px}.layout{display:flex;justify-content:center;gap:16px;align-items:flex-start}canvas{display:block;image-rendering:pixelated}#board{width:min(60vw,250px);height:auto;border:3px solid #555b83;background:#10121e}.side{width:130px;flex-shrink:0}.panel{border:2px solid #555b83;padding:10px;margin-bottom:12px;background:#141727}.label{color:#a7acd2;font-size:11px;margin-bottom:8px}.value{color:#ffe66d;font-size:25px;font-weight:bold}#next{width:100%;height:auto}button{border:2px solid #ffe66d;background:#ffe66d;color:#17182a;padding:12px 8px;font:bold 12px "Courier New",monospace;cursor:pointer;width:100%;margin-bottom:8px}button:hover{background:#fff3a8}button:active{transform:translateY(2px)}.controls{font-size:11px;color:#b9bddb;line-height:1.9}kbd{color:#fff;background:#30344e;border:1px solid #555b83;padding:2px 4px}.message{min-height:30px;text-align:center;color:#80f5d2;font-size:12px;padding-top:12px}.mobile-controls{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.mobile-controls button{font-size:20px;padding:12px 4px;touch-action:manipulation;user-select:none}@media(max-width:420px){body{padding:8px}.game{padding:12px}.layout{gap:10px}.side{width:100px}.panel{padding:7px}.value{font-size:20px}.controls{font-size:10px}.mobile-controls{display:grid}}
</style>
</head>
<body>
<div class="game">
<header><h1>I Got You!</h1><div class="subtitle">INSERT COIN · START GAME</div></header>
<div class="layout">
<canvas id="board" width="250" height="500"></canvas>
<aside class="side">
<div class="panel"><div class="label">SCORE</div><div class="value" id="score">00000</div></div>
<div class="panel"><div class="label">LINES</div><div class="value" id="lines">0</div></div>
<div class="panel"><div class="label">LEVEL</div><div class="value" id="level">1</div></div>
<div class="panel"><div class="label">NEXT BLOCK</div><canvas id="next" width="100" height="90"></canvas></div>
<button id="start">NEW GAME</button><button id="pause">PAUSE</button>
<div class="controls"><div class="label">CONTROLS</div><kbd>←</kbd> <kbd>→</kbd> Move<br><kbd>↑</kbd> Rotate<br><kbd>↓</kbd> Soft drop<br><kbd>SPACE</kbd> Hard drop<br><kbd>P</kbd> Pause<br><kbd>R</kbd> Restart</div>
</aside></div>
<div class="mobile-controls"><button data-action="left">←</button><button data-action="rotate">↻</button><button data-action="down">↓</button><button data-action="right">→</button><button data-action="drop" style="grid-column:span 4">HARD DROP ⬇</button></div>
<div class="message" id="message">PRESS NEW GAME TO PLAY</div>
</div>
<script>
(() => {
const canvas=document.getElementById("board"),ctx=canvas.getContext("2d"),nextCanvas=document.getElementById("next"),nctx=nextCanvas.getContext("2d");
const COLS=10,ROWS=20,SIZE=25;
const COLORS=[null,"#46e5d2","#5a79ff","#ff9e43","#ffe66d","#bc70ff","#68e56e","#ff6488"];
const SHAPES=[null,[[1,1,1,1]],[[2,0,0],[2,2,2]],[[0,0,3],[3,3,3]],[[4,4],[4,4]],[[0,5,0],[5,5,5]],[[0,6,6],[6,6,0]],[[7,7,0],[0,7,7]]];
let grid,piece,nextType,score,lines,level,running=false,paused=false,over=false,lastTime=0,dropCounter=0,animationId=null;
function newGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(0))}
function randomType(){return 1+Math.floor(Math.random()*7)}
function makePiece(type){const shape=SHAPES[type].map(row=>[...row]);return{shape,x:Math.floor((COLS-shape[0].length)/2),y:0}}
function collides(p,dx=0,dy=0,shape=p.shape){for(let y=0;y<shape.length;y++)for(let x=0;x<shape[y].length;x++){if(!shape[y][x])continue;const nx=p.x+x+dx,ny=p.y+y+dy;if(nx<0||nx>=COLS||ny>=ROWS)return true;if(ny>=0&&grid[ny][nx])return true}return false}
function spawn(){piece=makePiece(nextType);nextType=randomType();drawNext();if(collides(piece)){over=true;running=false;document.getElementById("message").textContent="GAME OVER — PRESS R TO RETRY"}}
function rotate(shape){return shape[0].map((_,i)=>shape.map(row=>row[i]).reverse())}
function tryRotate(){if(!running||paused||over)return;const rotated=rotate(piece.shape);for(const offset of [0,-1,1,-2,2])if(!collides(piece,offset,0,rotated)){piece.x+=offset;piece.shape=rotated;draw();return}}
function merge(){piece.shape.forEach((row,y)=>row.forEach((value,x)=>{if(value&&piece.y+y>=0)grid[piece.y+y][piece.x+x]=value}));let cleared=0;for(let y=ROWS-1;y>=0;y--)if(grid[y].every(cell=>cell!==0)){grid.splice(y,1);grid.unshift(Array(COLS).fill(0));cleared++;y++}if(cleared){score+=([0,100,300,500,800][cleared]||800)*level;lines+=cleared;level=Math.floor(lines/10)+1;document.getElementById("message").textContent=["","NICE! +100","DOUBLE! +300","TRIPLE! +500","TETRIS! +800"][cleared]||"GREAT!"}updateStats();spawn()}
function move(dx,dy){if(!running||paused||over)return;if(!collides(piece,dx,dy)){piece.x+=dx;piece.y+=dy;if(dy)score+=1;updateStats()}else if(dy>0)merge();draw()}
function hardDrop(){if(!running||paused||over)return;let distance=0;while(!collides(piece,0,1)){piece.y++;distance++}score+=distance*2;merge();draw();updateStats()}
function drawCell(context,x,y,color,size){context.fillStyle=color;context.fillRect(x*size+1,y*size+1,size-2,size-2);context.fillStyle="rgba(255,255,255,.22)";context.fillRect(x*size+2,y*size+2,size-4,3);context.fillStyle="rgba(0,0,0,.18)";context.fillRect(x*size+2,y*size+size-5,size-4,3)}
function draw(){ctx.fillStyle="#10121e";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle="#20243a";ctx.lineWidth=1;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*SIZE,0);ctx.lineTo(x*SIZE,canvas.height);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*SIZE);ctx.lineTo(canvas.width,y*SIZE);ctx.stroke()}grid.forEach((row,y)=>row.forEach((v,x)=>{if(v)drawCell(ctx,x,y,COLORS[v],SIZE)}));if(piece)piece.shape.forEach((row,y)=>row.forEach((v,x)=>{if(v&&piece.y+y>=0)drawCell(ctx,piece.x+x,piece.y+y,COLORS[v],SIZE)}));if(paused||over||!running){ctx.fillStyle="rgba(10,12,24,.78)";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.textAlign="center";ctx.fillStyle=over?"#ff6488":"#ffe66d";ctx.font="bold 19px Courier New";ctx.fillText(over?"GAME OVER":paused?"PAUSED":"PIKELBLAKS",canvas.width/2,canvas.height/2-8);ctx.fillStyle="#f5f5ff";ctx.font="11px Courier New";ctx.fillText(over?"PRESS R TO RESTART":paused?"PRESS P TO RESUME":"PRESS NEW GAME",canvas.width/2,canvas.height/2+18)}}
function drawNext(){nctx.fillStyle="#141727";nctx.fillRect(0,0,nextCanvas.width,nextCanvas.height);const shape=SHAPES[nextType],size=19,width=shape[0].length*size,height=shape.length*size,ox=(nextCanvas.width-width)/2,oy=(nextCanvas.height-height)/2;shape.forEach((row,y)=>row.forEach((v,x)=>{if(!v)return;nctx.fillStyle=COLORS[nextType];nctx.fillRect(ox+x*size+1,oy+y*size+1,size-2,size-2);nctx.fillStyle="rgba(255,255,255,.25)";nctx.fillRect(ox+x*size+2,oy+y*size+2,size-4,3)}))}
function updateStats(){document.getElementById("score").textContent=String(score).padStart(5,"0");document.getElementById("lines").textContent=lines;document.getElementById("level").textContent=level}
function startGame(){if(animationId!==null)cancelAnimationFrame(animationId);grid=newGrid();score=0;lines=0;level=1;paused=false;over=false;running=true;dropCounter=0;lastTime=0;nextType=randomType();spawn();updateStats();document.getElementById("message").textContent="GOOD LUCK!";document.getElementById("pause").textContent="PAUSE";draw();animationId=requestAnimationFrame(update)}
function togglePause(){if(!running||over)return;paused=!paused;document.getElementById("pause").textContent=paused?"RESUME":"PAUSE";document.getElementById("message").textContent=paused?"GAME PAUSED":"KEEP GOING!";draw()}
function update(time=0){if(!running||over){animationId=null;return}const delta=lastTime?time-lastTime:0;lastTime=time;if(!paused){dropCounter+=delta;const interval=Math.max(90,800-(level-1)*65);if(dropCounter>=interval){move(0,1);dropCounter=0}draw()}animationId=requestAnimationFrame(update)}
document.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==="r")return startGame();if(e.key.toLowerCase()==="p")return togglePause();if(!running||paused||over)return;switch(e.key){case"ArrowLeft":move(-1,0);break;case"ArrowRight":move(1,0);break;case"ArrowDown":move(0,1);break;case"ArrowUp":tryRotate();break;case" ":hardDrop();break}});
document.getElementById("start").addEventListener("click",startGame);document.getElementById("pause").addEventListener("click",togglePause);
document.querySelectorAll("[data-action]").forEach(button=>{const actions={left:()=>move(-1,0),right:()=>move(1,0),down:()=>move(0,1),rotate:tryRotate,drop:hardDrop};button.addEventListener("click",actions[button.dataset.action])});
grid=newGrid();piece=null;nextType=randomType();score=0;lines=0;level=1;drawNext();updateStats();draw();
})();
</script>
</body>
</html>
